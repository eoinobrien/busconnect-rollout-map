<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dublin city bus network</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .legend, .phase-control {
      background: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 1.55;
      max-width: 240px;
    }
    .legend h4, .phase-control h4 { margin: 0 0 6px 0; font-size: 13px; }
    .legend .swatch {
      display: inline-block;
      width: 14px; height: 4px;
      vertical-align: middle;
      margin-right: 6px;
    }
    .legend .meta {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #ddd;
      font-size: 11px;
      color: #555;
    }
    .phase-row {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .phase-row:hover { background: #f0f0f0; }
    .phase-row.active { background: #fff7d6; border-left: 3px solid #f5b800; padding-left: 1px; }
    .phase-id { font-weight: 600; min-width: 24px; display: inline-block; }
    .phase-date { color: #666; font-size: 11px; }
    .phase-count { color: #888; font-size: 11px; }

    .leaflet-tooltip.route-tooltip { font-size: 12px; padding: 4px 8px; }

    .clear-highlight {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #333; color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      display: none;
    }

    .error-banner {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #c0392b; color: white;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="clearHighlight" class="clear-highlight">Clear (Esc)</div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const CATEGORY_LABELS = {
      spine: 'Spines & high-frequency',
      orbital: 'Orbital (W / N / S)',
      local: 'Local (L)',
      peak: 'Peak only / express (P, X)',
      radial: 'Radial routes',
    };
    const CATEGORY_ORDER = ['radial', 'peak', 'local', 'orbital', 'spine'];
    const LEGEND_ORDER = ['spine', 'orbital', 'local', 'peak', 'radial'];

    const map = L.map('map', { preferCanvas: true }).setView([53.345, -6.26], 11);
    window.map = map;
    const renderer = L.canvas({ padding: 0.4 });

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> &middot; Data: <a href="https://www.transportforireland.ie/">Transport for Ireland</a> GTFS',
        subdomains: 'abcd',
        maxZoom: 19,
      }
    ).addTo(map);

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error-banner';
      div.textContent = msg;
      document.body.appendChild(div);
    }

    const allLayers = [];   // { layer, feature, baseStyle }
    let selectedRoutes = null;

    function baseStyle(feature) {
      return {
        color: feature.properties.colour,
        weight: 2.5,
        opacity: 0.85,
        lineCap: 'round',
        lineJoin: 'round',
      };
    }

    function dimStyle() {
      return { color: '#cfcfcf', weight: 1.2, opacity: 0.5 };
    }

    function highlightStyle(base) {
      return { ...base, weight: (base.weight || 2.5) + 2, opacity: 1 };
    }

    function applyHighlight(routeNames) {
      selectedRoutes = new Set(routeNames);
      for (const item of allLayers) {
        const matches = selectedRoutes.has(item.feature.properties.route_short_name);
        if (matches) {
          item.layer.setStyle(highlightStyle(item.baseStyle));
          if (item.layer.bringToFront) item.layer.bringToFront();
        } else {
          item.layer.setStyle(dimStyle());
        }
      }
      document.getElementById('clearHighlight').style.display = 'block';
    }

    function clearHighlight() {
      selectedRoutes = null;
      for (const item of allLayers) item.layer.setStyle(item.baseStyle);
      document.getElementById('clearHighlight').style.display = 'none';
    }

    document.getElementById('clearHighlight').addEventListener('click', clearHighlight);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearHighlight(); });

    function tooltipFor(feature) {
      const p = feature.properties;
      return `<b>${p.route_short_name}</b><br>${p.route_long_name || ''}<br><i>${p.agency || ''}</i>`;
    }

    Promise.all([
      fetch('output/routes.geojson').then(r => r.json()),
      fetch('output/meta.json').then(r => r.json()),
    ]).then(([routes, meta]) => {
      const groupsByCategory = {};
      for (const cat of CATEGORY_ORDER) groupsByCategory[cat] = L.layerGroup();

      for (const f of routes.features) {
        const base = baseStyle(f);
        const layer = L.geoJSON(f, { style: () => base, renderer });
        layer.eachLayer(l => {
          l.bindTooltip(tooltipFor(l.feature), { className: 'route-tooltip', sticky: true });
          l.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            applyHighlight([l.feature.properties.route_short_name]);
          });
        });
        const cat = f.properties.category || 'radial';
        layer.addTo(groupsByCategory[cat]);
        allLayers.push({ layer, feature: f, baseStyle: base });
      }

      // Add categories in render order: radial first (back), spine last (front).
      for (const cat of CATEGORY_ORDER) groupsByCategory[cat].addTo(map);

      // Layer control with category swatches.
      const overlays = {};
      for (const cat of LEGEND_ORDER) {
        const colour = meta.category_colours[cat];
        const count = (meta.category_route_counts || {})[cat] || 0;
        const label = `<span style="display:inline-block;width:12px;height:3px;background:${colour};margin-right:6px;vertical-align:middle"></span>${CATEGORY_LABELS[cat]} (${count})`;
        overlays[label] = groupsByCategory[cat];
      }
      L.control.layers(null, overlays, { collapsed: false, position: 'topright' }).addTo(map);

      // Legend with build info.
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        let html = '<h4>Route categories</h4>';
        for (const cat of LEGEND_ORDER) {
          const c = meta.category_colours[cat];
          const count = (meta.category_route_counts || {})[cat] || 0;
          html += `<div><span class="swatch" style="background:${c}"></span>${CATEGORY_LABELS[cat]} <span style="color:#888">(${count})</span></div>`;
        }
        const hf = meta.high_frequency_route_count || 0;
        html += `<div class="meta">Network of ${meta.reference_date}<br>${meta.route_count} routes<br>${hf} promoted to red by 8 am frequency<br><i>Click a route to highlight</i></div>`;
        div.innerHTML = html;
        return div;
      };
      legend.addTo(map);

      // Phase filter.
      const phasesMeta = meta.rollout_phases || {};
      const routePhase = meta.route_phase || {};
      const phaseRouteCounts = meta.phase_route_counts || {};
      const phaseIds = Object.keys(phasesMeta).sort();

      function routesInPhase(phaseId) {
        return Object.entries(routePhase).filter(([_, p]) => p === phaseId).map(([r]) => r);
      }

      if (phaseIds.length || phaseRouteCounts.legacy) {
        const phaseControl = L.control({ position: 'topleft' });
        phaseControl.onAdd = function () {
          const div = L.DomUtil.create('div', 'phase-control');
          L.DomEvent.disableClickPropagation(div);
          L.DomEvent.disableScrollPropagation(div);
          let html = '<h4>BusConnects phase</h4>';
          html += `<div class="phase-row" data-phase=""><span><span class="phase-id">All</span></span><span class="phase-count">${meta.route_count}</span></div>`;
          for (const pid of phaseIds) {
            const info = phasesMeta[pid];
            const cnt = phaseRouteCounts[pid] || 0;
            html += `<div class="phase-row" data-phase="${pid}"><span><span class="phase-id">${pid}</span><span class="phase-date">&nbsp;${info.date}</span></span><span class="phase-count">${cnt}</span></div>`;
          }
          const legacy = phaseRouteCounts.legacy || 0;
          if (legacy) {
            html += `<div class="phase-row" data-phase="legacy"><span><span class="phase-id">Legacy</span><span class="phase-date">&nbsp;pre-BusConnects</span></span><span class="phase-count">${legacy}</span></div>`;
          }
          div.innerHTML = html;
          div.querySelectorAll('.phase-row').forEach(row => {
            row.addEventListener('click', () => {
              const pid = row.getAttribute('data-phase');
              div.querySelectorAll('.phase-row').forEach(r => r.classList.remove('active'));
              if (!pid) { clearHighlight(); return; }
              row.classList.add('active');
              applyHighlight(routesInPhase(pid));
            });
          });
          return div;
        };
        phaseControl.addTo(map);
      }

      map.on('click', () => { if (selectedRoutes) clearHighlight(); });
    }).catch(err => {
      console.error(err);
      showError(
        'Could not load output/routes.geojson. Run "python build.py" then serve via "python -m http.server --bind 127.0.0.1" and reload.'
      );
    });
  </script>
</body>
</html>
