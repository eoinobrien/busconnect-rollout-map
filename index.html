<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dublin city bus network</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .legend {
      background: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 1.55;
    }
    .legend h4 { margin: 0 0 6px 0; font-size: 13px; }
    .legend .swatch {
      display: inline-block;
      width: 14px; height: 4px;
      vertical-align: middle;
      margin-right: 6px;
    }
    .legend .meta {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #ddd;
      font-size: 11px;
      color: #555;
    }

    .leaflet-tooltip.route-tooltip {
      font-size: 12px;
      padding: 4px 8px;
    }

    /* Route number badges */
    .route-badge {
      background: white;
      border: 2px solid var(--c, #888);
      color: var(--c, #444);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      white-space: nowrap;
      box-shadow: 0 1px 1px rgba(0,0,0,0.15);
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
    }

    .clear-highlight {
      position: absolute;
      top: 12px; right: 50%;
      transform: translateX(50%);
      z-index: 1000;
      background: #333;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      display: none;
    }

    .error-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #c0392b;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="clearHighlight" class="clear-highlight">Clear selection (Esc)</div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const CATEGORY_LABELS = {
      spine: 'Spines & high-frequency',
      orbital: 'Orbital (W / N / S)',
      local: 'Local (L)',
      peak: 'Peak only / express (P, X)',
      radial: 'Radial routes',
    };
    const CATEGORY_ORDER = ['spine', 'orbital', 'local', 'peak', 'radial'];

    const map = L.map('map', { preferCanvas: true }).setView([53.345, -6.26], 11);
    const lineRenderer = L.canvas({ padding: 0.4 });

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> &middot; Data: <a href="https://www.transportforireland.ie/">Transport for Ireland</a> GTFS',
        subdomains: 'abcd',
        maxZoom: 19,
      }
    ).addTo(map);

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error-banner';
      div.textContent = msg;
      document.body.appendChild(div);
    }

    // ----- highlight state ----------------------------------------------
    // Each route line / label remembers its base style so we can restore
    // when the user clears a selection.
    const allRouteLines = [];   // {layer, feature, baseStyle}
    const allLabelMarkers = []; // {marker, routeName, category}
    let selectedRoute = null;

    function lineStyle(feature) {
      const p = feature.properties;
      const isTrunk = p.kind === 'trunk';
      return {
        color: p.colour,
        weight: isTrunk ? 4.5 : 2.5,
        opacity: isTrunk ? 0.9 : 0.75,
        lineCap: 'round',
        lineJoin: 'round',
      };
    }

    function dimStyle() {
      return { color: '#cfcfcf', weight: 1.2, opacity: 0.45 };
    }

    function highlightStyle(baseStyle) {
      return { ...baseStyle, weight: (baseStyle.weight || 3) + 2, opacity: 1 };
    }

    function routesOnFeature(f) {
      // A feature lists either a single route_short_name (for non-spine
      // and label points) or a route_set (for bundled spine segments).
      if (f.properties.route_set) return f.properties.route_set;
      if (f.properties.route_short_name) return [f.properties.route_short_name];
      return [];
    }

    function applyHighlight(routeName) {
      selectedRoute = routeName;
      for (const item of allRouteLines) {
        const matches = routesOnFeature(item.feature).includes(routeName);
        if (matches) {
          item.layer.setStyle(highlightStyle(item.baseStyle));
          if (item.layer.bringToFront) item.layer.bringToFront();
        } else {
          item.layer.setStyle(dimStyle());
        }
      }
      for (const item of allLabelMarkers) {
        const el = item.marker.getElement();
        if (!el) continue;
        el.style.opacity = item.routeName === routeName ? '1' : '0.15';
      }
      document.getElementById('clearHighlight').style.display = 'block';
    }

    function clearHighlight() {
      selectedRoute = null;
      for (const item of allRouteLines) {
        item.layer.setStyle(item.baseStyle);
      }
      for (const item of allLabelMarkers) {
        const el = item.marker.getElement();
        if (el) el.style.opacity = '1';
      }
      document.getElementById('clearHighlight').style.display = 'none';
    }

    document.getElementById('clearHighlight').addEventListener('click', clearHighlight);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearHighlight(); });

    function tooltipForLine(f) {
      const p = f.properties;
      if (p.route_set) {
        const label = p.kind === 'trunk' ? 'Trunk' : 'Branch';
        return `<b>${p.spine}-spine ${label}</b><br>${p.route_set.join(', ')}`;
      }
      return `<b>${p.route_short_name}</b><br>${p.route_long_name || ''}<br><i>${p.agency || ''}</i>`;
    }

    // ----- main ----------------------------------------------------------
    Promise.all([
      fetch('output/spines.geojson').then(r => r.json()),
      fetch('output/routes.geojson').then(r => r.json()),
      fetch('output/labels.geojson').then(r => r.json()),
      fetch('output/meta.json').then(r => r.json()),
    ]).then(([spines, routes, labels, meta]) => {
      const categoryGroups = Object.fromEntries(
        CATEGORY_ORDER.map(c => [c, L.layerGroup()])
      );

      function addLine(feature) {
        const cat = feature.properties.category || 'radial';
        const baseStyle = lineStyle(feature);
        const layer = L.geoJSON(feature, {
          style: () => baseStyle,
          renderer: lineRenderer,
        });
        layer.eachLayer(l => {
          l.bindTooltip(tooltipForLine(l.feature), {
            className: 'route-tooltip',
            sticky: true,
          });
          l.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            const routes = routesOnFeature(l.feature);
            // For spine trunks listing many routes, picking the first
            // is a reasonable default; user can always click a branch.
            applyHighlight(routes[0]);
          });
        });
        layer.addTo(categoryGroups[cat]);
        allRouteLines.push({ layer, feature, baseStyle });
      }

      for (const f of spines.features) addLine(f);
      for (const f of routes.features) addLine(f);

      // Labels: one DivIcon per terminus, hidden until zoomed in to
      // keep the city-wide view legible.
      const labelLayer = L.layerGroup();
      for (const f of labels.features) {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        const html = `<div class="route-badge" style="--c:${p.colour}">${p.route_short_name}</div>`;
        const marker = L.marker([lat, lon], {
          icon: L.divIcon({ html, className: '', iconSize: null }),
          interactive: true,
        });
        marker.on('click', (ev) => {
          L.DomEvent.stopPropagation(ev);
          applyHighlight(p.route_short_name);
        });
        marker.addTo(labelLayer);
        allLabelMarkers.push({ marker, routeName: p.route_short_name, category: p.category });
      }

      // Toggle labels with zoom: the city view shows too many to be
      // useful at z<=11, so attach the label layer only above that.
      function syncLabels() {
        if (map.getZoom() >= 12 && !map.hasLayer(labelLayer)) {
          labelLayer.addTo(map);
        } else if (map.getZoom() < 12 && map.hasLayer(labelLayer)) {
          map.removeLayer(labelLayer);
        }
      }
      map.on('zoomend', syncLabels);
      syncLabels();

      // All categories on by default.
      for (const cat of CATEGORY_ORDER) categoryGroups[cat].addTo(map);

      // Layer control with category swatches
      const overlays = {};
      for (const cat of CATEGORY_ORDER) {
        const colour = meta.category_colours[cat];
        const label = `<span style="display:inline-block;width:12px;height:3px;background:${colour};margin-right:6px;vertical-align:middle"></span>${CATEGORY_LABELS[cat]}`;
        overlays[label] = categoryGroups[cat];
      }
      L.control.layers(null, overlays, { collapsed: false, position: 'topright' }).addTo(map);

      // Legend
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        let html = '<h4>Route categories</h4>';
        for (const cat of CATEGORY_ORDER) {
          const c = meta.category_colours[cat];
          html += `<div><span class="swatch" style="background:${c}"></span>${CATEGORY_LABELS[cat]}</div>`;
        }
        const labelCount = labels.features.length;
        html += `<div class="meta">Network of ${meta.reference_date}<br>${meta.route_count} routes &middot; ${meta.spine_feature_count + meta.other_feature_count} segments &middot; ${labelCount} labels<br><i>Click a route to highlight</i></div>`;
        div.innerHTML = html;
        return div;
      };
      legend.addTo(map);

      // Clicking the basemap (anywhere not on a feature) clears the
      // current highlight.
      map.on('click', () => { if (selectedRoute) clearHighlight(); });
    }).catch(err => {
      console.error(err);
      showError(
        'Could not load output GeoJSON. Run "python build.py" then serve via "python -m http.server --bind 127.0.0.1" and reload.'
      );
    });
  </script>
</body>
</html>
