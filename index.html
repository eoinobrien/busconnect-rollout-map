<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dublin city bus network</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .panel {
      background: rgba(255,255,255,0.95);
      padding: 12px 14px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 1.5;
      width: 240px;
      /* Cap to viewport so the panel doesn't run past the bottom of
         the map; scroll internally when the search + categories +
         live phases + future phases stack would otherwise exceed it.
         Topright Leaflet control inset is ~16px above and below. */
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .panel h3 { margin: 0; font-size: 14px; font-weight: 700; }
    .panel .panel-sub {
      color: #666;
      font-size: 11px;
      margin-top: 2px;
    }
    .panel .section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ececec;
    }
    .panel .section-title {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 6px;
    }
    .panel .section-note {
      font-size: 10px;
      line-height: 1.35;
      color: #888;
      font-style: italic;
      margin-bottom: 6px;
    }
    .panel .future-section .section-title { color: #b07b00; }
    .panel .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 6px;
      margin: 1px -4px;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }
    .panel .row:hover { background: #f3f3f3; }
    .panel .row.active { background: #fff7d6; }
    .panel .row.inactive .label-text { color: #b5b5b5; }
    .panel .row.inactive .swatch { opacity: 0.25; }
    .panel .row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .panel .label-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .panel .swatch {
      display: inline-block;
      width: 16px; height: 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .panel .row-count {
      color: #888;
      font-size: 11px;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .panel .phase-id {
      display: inline-block;
      min-width: 22px;
      font-weight: 700;
      text-align: center;
      flex-shrink: 0;
    }
    .panel .phase-date {
      color: #666;
      font-size: 11px;
      margin-left: 6px;
    }
    .panel .row-note {
      color: #888;
      font-size: 10px;
      line-height: 1.3;
      margin: -2px 0 6px 24px;
    }
    .panel .check {
      width: 14px;
      height: 14px;
      border: 1px solid #aaa;
      border-radius: 2px;
      background: white;
      flex-shrink: 0;
      position: relative;
    }
    .panel .row.active .check { background: #f5b800; border-color: #d09a00; }
    .panel .row.active .check::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0;
      width: 4px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .panel .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 7px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
    }
    .panel .search-input:focus { outline: none; border-color: #f5b800; }
    .panel .search-results {
      max-height: 180px;
      overflow-y: auto;
      margin-top: 6px;
    }
    .panel .search-empty {
      color: #999;
      font-size: 11px;
      font-style: italic;
      padding: 4px 6px;
    }
    .panel .search-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      margin: 1px -4px;
      border-radius: 3px;
      cursor: pointer;
    }
    .panel .search-row:hover { background: #f3f3f3; }
    .panel .search-row .swatch {
      width: 14px; height: 3px; flex-shrink: 0;
    }
    .panel .search-route {
      font-weight: 700;
      flex-shrink: 0;
      min-width: 32px;
    }
    .panel .search-long {
      font-size: 11px;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leaflet-tooltip.route-tooltip { font-size: 12px; padding: 4px 8px; }

    .route-label {
      display: inline-flex;
      border-radius: 10px;
      overflow: hidden;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
      white-space: nowrap;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }
    /* Zoom-gated hide: applied via a class on the map container so
       PolylineDecorator's markers can stay on the map permanently
       (taking decorators off the map rebuilds the marker layers and
       invalidates the references in allLabels). Inline display:none
       from applyLabelVisibility still wins via specificity, so per-
       phase / replacement filters keep working. */
    .leaflet-container.labels-hidden .leaflet-marker-icon { display: none; }
    .route-label > span {
      display: inline-block;
      padding: 1px 5px;
      color: white;
      text-align: center;
    }
    /* Future routes: outline-only fill so a planned A1* reads as
       hollow next to a live A1. Per-span border colour comes from
       the inline style (set with --route-colour); white background
       keeps the asterisk and id legible against the map. */
    .route-label.future {
      background: white;
      box-shadow: none;
    }
    .route-label.future > span {
      background: white !important;
      color: var(--route-colour, #555);
      border: 1px solid var(--route-colour, #555);
      padding: 0 4px;
      border-radius: 10px;
      margin: 0 1px;
    }

    .clear-highlight {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #333; color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      display: none;
    }

    .error-banner {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #c0392b; color: white;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      max-width: 90vw;
    }

    /* Mobile: panel becomes a bottom sheet anchored to the screen
       edge. Collapsed shows just the header (title + drag handle);
       tap to expand the body to ~65vh with internal scroll. Desktop
       ignores all of this (no media match) and keeps the topright
       sidebar. */
    @media (max-width: 768px) {
      .leaflet-top.leaflet-right {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        pointer-events: none;
        /* Leaflet places .leaflet-bottom.leaflet-left (attribution)
           after this container in the DOM, so at equal z-index the
           attribution paints on top of the panel. Lift the panel
           above it so the expanded sheet cleanly covers the credits;
           the collapsed state shows them just above the header. */
        z-index: 1001;
      }
      .leaflet-top.leaflet-right .leaflet-control {
        margin: 0;
        pointer-events: auto;
      }
      .panel {
        width: 100%;
        max-width: 100%;
        padding: 0;
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -2px 12px rgba(0,0,0,0.18);
        overflow: hidden;
      }
      .panel-header {
        padding: 8px 14px 10px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: rgba(255,255,255,0.98);
      }
      .panel-header::before {
        content: '';
        display: block;
        width: 36px;
        height: 4px;
        margin: 0 auto 8px;
        background: #d4d4d4;
        border-radius: 2px;
      }
      .panel-body {
        /* Collapse / expand via max-height transition. border-box
           keeps padding inside the height budget so the body never
           overflows the panel's overflow:hidden boundary - that was
           clipping the bottom of the phase list. */
        box-sizing: border-box;
        max-height: 0;
        padding: 0 14px;
        overflow: hidden;
        transition: max-height 0.3s ease-out, padding 0.3s ease-out;
      }
      .panel.expanded .panel-body {
        max-height: 65vh;
        padding: 0 14px 14px;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      /* Search results expand to fit available sheet height rather
         than the desktop's fixed 180px box. */
      .panel .search-results { max-height: none; }

      /* Attribution sits at bottom-left of the map; the collapsed
         sheet header now occupies that strip. Push the attribution
         container above the header so OSM/CARTO/TfI credits stay
         legible in the default (collapsed) state. ~70px matches the
         measured header height including its drag-handle. */
      .leaflet-bottom.leaflet-left {
        bottom: 72px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="clearHighlight" class="clear-highlight">Clear (Esc)</div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"
  ></script>
  <script src="viewer/visibility.js"></script>
  <script>
    const CATEGORY_LABELS = {
      spine: 'Spines & high-frequency',
      orbital: 'Orbital (W / N / S)',
      local: 'Local (L)',
      peak: 'Peak only / express (P, X)',
      radial: 'Radial routes',
    };
    const CATEGORY_ORDER = ['radial', 'peak', 'local', 'orbital', 'spine'];
    const LEGEND_ORDER = ['spine', 'orbital', 'local', 'peak', 'radial'];

    const map = L.map('map', { preferCanvas: true }).setView([53.345, -6.26], 11);
    // Move OSM / CARTO / TfI attribution to bottom-left so the
    // bottom-right corner stays clear (we use that area for future
    // panel overflow scroll). OSM and CARTO both require the
    // attribution to be visible and legible, but neither pins its
    // position - bottom-left meets that bar.
    map.attributionControl.setPosition('bottomleft');
    window.map = map;
    const renderer = L.canvas({ padding: 0.4 });

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> &middot; Data: <a href="https://www.transportforireland.ie/">Transport for Ireland</a> GTFS',
        subdomains: 'abcd',
        maxZoom: 19,
      }
    ).addTo(map);

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error-banner';
      div.textContent = msg;
      document.body.appendChild(div);
    }

    const allLayers = [];   // { layer, feature, baseStyle, hidden }
    const allLabels = [];   // { marker, routes, phase }
    let selectedRoutes = null;

    // Future-network state.
    //  - futurePhases: phase ids declared with date === "future" in
    //    rollout-phases.json. Populated once meta loads.
    //  - visibleFuturePhases: subset of futurePhases the user has
    //    explicitly opted in to. Default empty (hide planned routes).
    //  - hiddenReplacedRoutes: route ids that are about to be replaced
    //    by an active future phase; computed from each active phase's
    //    `replacing` array.
    const futurePhases = new Set();
    const visibleFuturePhases = new Set();
    // Map<route_id, Set<phase_id>>: which active future phases list
    // this route in their `replacing` array. When the route shows up
    // in a feature, hide it UNLESS that feature's own phase is one of
    // the replacing phases — i.e. the feature is the new version of
    // the route introduced by that phase. Handles the case where a
    // route_id (e.g. "80") appears as both replaced legacy and brand
    // new in the same rollout.
    let replacingByPhase = new Map();

    function weightForRoutes(n) {
      // Stroke width grows with how many routes share this category
      // at this corridor — a trunk carrying 6+ routes reads as
      // visibly thicker than a single-route stretch.
      return Math.min(2 + 0.5 * n, 6.5);
    }

    function baseStyle(feature) {
      const n = (feature.properties.routes || []).length || 1;
      return {
        color: feature.properties.colour,
        weight: weightForRoutes(n),
        opacity: 0.85,
        lineCap: 'round',
        lineJoin: 'round',
      };
    }

    function dimStyle() {
      return { color: '#cfcfcf', weight: 1.2, opacity: 0.5 };
    }

    function highlightStyle(base) {
      return { ...base, weight: (base.weight || 2.5) + 2, opacity: 1 };
    }

    const HIDDEN_STYLE = { opacity: 0, weight: 0, fillOpacity: 0 };

    // Active-future phases that *contain* at least one currently
    // highlighted route. Used to decide whether peer routes in an
    // active future phase should fall to dim (when the user has drilled
    // into the phase) or stay in baseStyle (when the highlight lives
    // elsewhere and the phase is just a network preview).
    let _phasesInHighlight = new Set();

    function recomputeHiddenReplacedRoutes() {
      replacingByPhase = window.MapVisibility.computeReplacingByPhase(
        visibleFuturePhases, window._phasesMeta || {},
      );
    }

    function isRouteReplacedFor(routeId, phaseId) {
      return window.MapVisibility.isRouteReplacedFor(routeId, phaseId, {
        replacingByPhase,
      });
    }

    function recomputePhasesInHighlight() {
      _phasesInHighlight = window.MapVisibility.computePhasesInHighlight(
        selectedRoutes, window._routePhase || {},
        futurePhases, visibleFuturePhases,
      );
    }

    function isFeatureHidden(feature) {
      const p = feature.properties || {};
      const phase = p.phase || 'legacy';
      if (futurePhases.has(phase) && !visibleFuturePhases.has(phase)) {
        return true;
      }
      const fRoutes = p.routes || (p.route ? [p.route] : []);
      if (fRoutes.length === 0) return false;
      // A shared-corridor feature carries multiple route_ids. We
      // hide it only when EVERY route on it has been replaced; if at
      // least one is still active the line stays. The label and
      // tooltip filter out the replaced names so the user only sees
      // the routes that remain on the segment.
      return fRoutes.every(r => isRouteReplacedFor(r, phase));
    }

    function visibleRoutesFor(feature) {
      // Subset of a feature's routes that aren't currently replaced
      // (used for label and tooltip rendering when a future phase is
      // active mid-corridor).
      const p = feature.properties || {};
      const phase = p.phase || 'legacy';
      const fRoutes = p.routes || (p.route ? [p.route] : []);
      return fRoutes.filter(r => !isRouteReplacedFor(r, phase));
    }

    function styleForItem(item) {
      if (item.hidden) return HIDDEN_STYLE;
      if (!selectedRoutes) return item.baseStyle;
      const fRoutes = item.feature.properties.routes || [];
      if (fRoutes.some(r => selectedRoutes.has(r))) {
        return highlightStyle(item.baseStyle);
      }
      const phase = item.feature.properties.phase || 'legacy';
      // Routes in an active future phase render in baseStyle as long
      // as the highlight isn't on a route *within* that phase. As soon
      // as the user picks a route inside phase X, the rest of X falls
      // to dim so the picked one stands out (scenario 7). When the
      // highlight is elsewhere - legacy route, different future phase
      // - active future phases stay visible alongside (scenarios 6, 8).
      if (futurePhases.has(phase)
          && visibleFuturePhases.has(phase)
          && !_phasesInHighlight.has(phase)) {
        return item.baseStyle;
      }
      return dimStyle();
    }

    function applyVisibility() {
      recomputeHiddenReplacedRoutes();
      recomputePhasesInHighlight();
      for (const item of allLayers) {
        item.hidden = isFeatureHidden(item.feature);
        item.layer.setStyle(styleForItem(item));
        if (!item.hidden && selectedRoutes && item.layer.bringToFront) {
          const fRoutes = item.feature.properties.routes || [];
          if (fRoutes.some(r => selectedRoutes.has(r))) item.layer.bringToFront();
        }
      }
      if (window._applyLabelVisibility) window._applyLabelVisibility();
      updateFuturePhaseRows();
    }

    function applyHighlight(routeNames) {
      // Highlight every feature whose `routes` membership intersects
      // the selection. With per-category collapse, a clicked route
      // lights up every category-line that carries it. Selecting a
      // route that belongs to a future phase auto-activates that
      // phase's visibility so the user sees the planned alignment.
      selectedRoutes = new Set(routeNames);
      const routePhase = window._routePhase || {};
      for (const r of routeNames) {
        const p = routePhase[r];
        if (p && futurePhases.has(p)) visibleFuturePhases.add(p);
      }
      applyVisibility();
      document.getElementById('clearHighlight').style.display = 'block';
    }

    function clearHighlight() {
      selectedRoutes = null;
      // Roll back any future phase the highlight auto-activated, so
      // we return to the "current network only" default.
      visibleFuturePhases.clear();
      if (window._selectedPhases) window._selectedPhases.clear();
      document.querySelectorAll('.panel [data-phase].active')
        .forEach(r => r.classList.remove('active'));
      applyVisibility();
      document.getElementById('clearHighlight').style.display = 'none';
    }

    function updateFuturePhaseRows() {
      // Reflect visibleFuturePhases state on the panel rows; rows
      // for future phases use the same .active class as the legacy
      // highlight rows for visual consistency.
      document.querySelectorAll('.panel [data-phase]').forEach(row => {
        const pid = row.getAttribute('data-phase');
        if (!futurePhases.has(pid)) return;
        if (visibleFuturePhases.has(pid)) row.classList.add('active');
        else row.classList.remove('active');
      });
    }

    document.getElementById('clearHighlight').addEventListener('click', clearHighlight);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearHighlight(); });

    function compareRouteShort(a, b) {
      // Spines (single letter A-H + digits) first, sorted by letter
      // then number. Then numeric routes ascending — bare numbers
      // before their letter-suffix variants (14, 14A, 14C). Then
      // letter-prefixed orbitals/locals/peaks in lex order.
      const spineA = a.match(/^([A-H])(\d+)$/);
      const spineB = b.match(/^([A-H])(\d+)$/);
      if (spineA && !spineB) return -1;
      if (!spineA && spineB) return 1;
      if (spineA && spineB) {
        if (spineA[1] !== spineB[1]) return spineA[1] < spineB[1] ? -1 : 1;
        return parseInt(spineA[2], 10) - parseInt(spineB[2], 10);
      }
      const numA = a.match(/^(\d+)([A-Z]*)$/);
      const numB = b.match(/^(\d+)([A-Z]*)$/);
      if (numA && !numB) return -1;
      if (!numA && numB) return 1;
      if (numA && numB) {
        const di = parseInt(numA[1], 10) - parseInt(numB[1], 10);
        if (di !== 0) return di;
        return numA[2] < numB[2] ? -1 : numA[2] > numB[2] ? 1 : 0;
      }
      return a < b ? -1 : a > b ? 1 : 0;
    }

    function formatRouteList(routes, featurePhase) {
      // When phase rows are selected, narrow the tooltip to just
      // the routes in that phase — hovering a shared corridor with
      // phase 1 selected should show only the H spines, not every
      // HF radial that happens to share the road. Routes that have
      // been replaced by an active future phase are also dropped so
      // a [82, 65] bundle hovered after activating 65's replacement
      // reads as just "82".
      let arr = (routes || []).slice();
      if (featurePhase != null) {
        arr = arr.filter(r => !isRouteReplacedFor(r, featurePhase));
      }
      const selected = window._selectedPhases;
      const routePhase = window._routePhase || {};
      let filtered = arr;
      if (selected && selected.size) {
        filtered = arr.filter(r => selected.has(routePhase[r] || 'legacy'));
        // If the hovered feature carries nothing from the selection,
        // fall back to the full list so the tooltip remains useful.
        if (!filtered.length) filtered = arr;
      }
      return filtered.sort(compareRouteShort).join(', ');
    }

    function tooltipFor(feature) {
      const p = feature.properties;
      const names = formatRouteList(p.routes, p.phase || 'legacy');
      return `<b>${names}</b><br>${p.route_long_name || ''}<br><i>${p.agency || ''}</i>`;
    }

    function railColor(feature) {
      // LUAS Green/Red lines pick up their official line colour;
      // Iarnród Éireann lines all share orange. Rendered as
      // colour-and-white stripes (a white solid base with a
      // dashed coloured overlay on top).
      const p = feature.properties;
      if (p.mode === 'luas') {
        if (p.short === 'Green') return '#00a651';
        if (p.short === 'Red') return '#e2231a';
        return '#888';
      }
      return '#ed7611';
    }

    Promise.all([
      fetch('output/routes.geojson').then(r => r.json()),
      fetch('output/meta.json').then(r => r.json()),
      fetch('output/rail.geojson').then(r => r.ok ? r.json() : { features: [] }).catch(() => ({ features: [] })),
    ]).then(([routes, meta, rail]) => {
      // Render rail and LUAS as two stacked layers per feature: a
      // wider solid white base, then a coloured dashed overlay.
      // The dash gaps reveal the white underneath, producing the
      // alternating colour-and-white stripe convention used on
      // most transit maps. No tooltips, no click handlers —
      // purely background context for orientation.
      const railWhiteBase = L.geoJSON(rail, {
        style: { color: '#ffffff', weight: 5, opacity: 0.95 },
        interactive: false,
        renderer,
      });
      const railColoured = L.geoJSON(rail, {
        style: f => ({
          color: railColor(f),
          weight: 3,
          opacity: 1,
          dashArray: '8,8',
          lineCap: 'butt',
        }),
        interactive: false,
        renderer,
      });
      // railWhiteBase + railColoured are added *after* the bus
      // layers below so rail stripes stay visible where buses
      // (e.g. the 102 through Sutton↔Howth Junction) would
      // otherwise paint over the DART spur.

      const groupsByCategory = {};
      for (const cat of CATEGORY_ORDER) groupsByCategory[cat] = L.layerGroup();

      // Track which categories the user has visible. The panel rows
      // mutate this; applyLabelVisibility reads it so shield markers
      // hide alongside the lines they belong to. Declared up here so
      // it's in scope when syncLabels first runs below.
      const visibleCategories = new Set(LEGEND_ORDER);

      // A phase is "future" when its `date` field isn't an ISO date.
      // "future", "unknown", "planned", "tbd" all qualify - any non-
      // YYYY-MM-DD signals the rollout hasn't been scheduled yet.
      const _ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
      const _isFutureDate = d => !_ISO_DATE.test(d || '');

      // Populate futurePhases BEFORE the features loop. The loop's
      // styling branch ("isFuture ? outline pill : filled pill")
      // reads futurePhases.has(phase); without populating it now,
      // every future route would be rendered with the live filled
      // pill (no asterisk) and only later be hidden by visibility.
      const phasesMetaEarly = meta.rollout_phases || {};
      window._phasesMeta = phasesMetaEarly;
      futurePhases.clear();
      for (const [pid, info] of Object.entries(phasesMetaEarly)) {
        if (info && _isFutureDate(info.date)) {
          futurePhases.add(pid);
        }
      }
      window._routePhase = meta.route_phase || {};

      // One PolylineDecorator per route feature. Live routes get the
      // existing filled pill style (route-label); future routes get
      // the outline pill with an asterisk (route-label future). All
      // markers register into allLabels for the visibility filter.
      const routeDecorators = [];

      for (const f of routes.features) {
        const base = baseStyle(f);
        const layer = L.geoJSON(f, { style: () => base, renderer });
        layer.eachLayer(l => {
          l.bindTooltip(() => tooltipFor(l.feature), { className: 'route-tooltip', sticky: true });
          l.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            const rs = l.feature.properties.routes || [];
            if (rs.length) applyHighlight(rs);
          });
        });
        const cat = f.properties.category || 'radial';
        layer.addTo(groupsByCategory[cat]);
        allLayers.push({ layer, feature: f, baseStyle: base });

        // Attach a PolylineDecorator to every route. Five shield
        // markers placed at 10/30/50/70/90 % along the line, click =
        // highlight the route. PolylineDecorator wants getLatLngs(),
        // which the L.GeoJSON wrapper doesn't expose - extract the
        // inner polyline(s) before constructing.
        const phase = f.properties.phase || 'legacy';
        const route = f.properties.route;
        const col = f.properties.colour || '#888';
        const isFuture = futurePhases.has(phase);
        const pillStyle = isFuture
          ? `--route-colour:${col}`
          : `background:${col}`;
        const pillClass = isFuture ? 'route-label future' : 'route-label';
        const innerPolylines = [];
        layer.eachLayer(l => innerPolylines.push(l));
        if (innerPolylines.length) {
          const dec = L.polylineDecorator(innerPolylines, {
            patterns: [{
              offset: '10%',
              repeat: '20%',
              symbol: L.Symbol.marker({
                rotate: false,
                markerOptions: {
                  keyboard: false,
                  icon: L.divIcon({
                    className: '',
                    html: `<div class="${pillClass}"><span data-route="${route}" style="${pillStyle}">${route}</span></div>`,
                    iconSize: null,
                  }),
                },
              }),
            }],
          });
          dec.addTo(map);
          // PolylineDecorator subscribes to map.moveend and calls
          // redraw -> _draw -> clearLayers() on every pan / zoom,
          // destroying the markers and replacing them with fresh
          // ones. allLabels' references go stale and visibility
          // can't be re-applied to the new set. Our pattern is a
          // percentage of line length (constant in lat/lng), so
          // there's nothing to recompute on a move - kill the
          // listener so markers stay put.
          map.off('moveend', dec.redraw, dec);
          // PolylineDecorator wraps each pattern's markers in a
          // FeatureGroup, so dec.eachLayer yields groups - recurse
          // until we hit an actual L.Marker. We must use instanceof
          // and NOT typeof layer.getElement === 'function' because
          // L.FeatureGroup inherits getElement too (returns undefined)
          // and would slip through, leaving applyLabelVisibility
          // unable to hide its DOM later.
          const collectMarkers = layer => {
            if (layer instanceof L.Marker) {
              layer.on('click', (ev) => {
                L.DomEvent.stopPropagation(ev);
                applyHighlight([route]);
              });
              allLabels.push({ marker: layer, routes: [route], phase, category: cat });
            } else if (layer && typeof layer.eachLayer === 'function') {
              layer.eachLayer(collectMarkers);
            }
          };
          dec.eachLayer(collectMarkers);
          routeDecorators.push(dec);
        }
      }

      // Add categories in render order: radial first (back), spine last (front).
      for (const cat of CATEGORY_ORDER) groupsByCategory[cat].addTo(map);

      // Rail/LUAS goes last so stripes sit on top of all bus
      // categories — bus colours show through the dash gaps,
      // but the orange/red/green DART/LUAS stripes never get
      // hidden by a bus that happens to share the road.
      railWhiteBase.addTo(map);
      railColoured.addTo(map);

      // Route labels: every route's PolylineDecorator was already
      // attached in the features loop above. Here we just control
      // their zoom-gated visibility — hidden below LABEL_MIN_ZOOM,
      // visible above.
      const LABEL_MIN_ZOOM = 13;
      function applyLabelVisibility() {
        // Single source of truth for the per-label / per-pill rules
        // lives in window.MapVisibility (also covered by node tests in
        // tests/test_viewer_visibility.js). Here we just translate
        // those decisions into DOM updates.
        const state = {
          futurePhases,
          visibleFuturePhases,
          visibleCategories,
          selectedRoutes,
          phasesInHighlight: _phasesInHighlight,
          replacingByPhase,
        };
        for (const lbl of allLabels) {
          const el = lbl.marker.getElement();
          if (!el) continue;
          if (window.MapVisibility.isLabelHidden(lbl, state)) {
            el.style.display = 'none';
            continue;
          }
          let visiblePillCount = 0;
          el.querySelectorAll('[data-route]').forEach(pillEl => {
            const r = pillEl.getAttribute('data-route');
            const pillVisible = window.MapVisibility.isPillVisible(r, lbl, state);
            pillEl.style.display = pillVisible ? '' : 'none';
            if (pillVisible) visiblePillCount++;
          });
          el.style.display = visiblePillCount > 0 ? '' : 'none';
        }
      }
      window._applyLabelVisibility = applyLabelVisibility;

      function syncLabels() {
        // Toggle a CSS class on the map container rather than
        // removing decorators from the map - removing them
        // re-creates the marker layers and breaks allLabels'
        // reference to the originals (then per-phase visibility
        // can't take effect on the new markers and future shields
        // appear by default at low zoom).
        const mapEl = map.getContainer();
        if (map.getZoom() >= LABEL_MIN_ZOOM) {
          mapEl.classList.remove('labels-hidden');
        } else {
          mapEl.classList.add('labels-hidden');
        }
      }
      map.on('zoomend', syncLabels);
      syncLabels();

      // Unified control panel: header + category visibility section
      // + BusConnects phase multi-select section. Replaces the
      // separate Leaflet layer control, bottom-right legend, and
      // top-left phase control.
      const phasesMeta = meta.rollout_phases || {};
      const routePhase = meta.route_phase || {};
      const phaseRouteCounts = meta.phase_route_counts || {};

      // Stable ordering: historical phases first by date, then the
      // future ones at the bottom. Future phases sort by their leading
      // number ("8 (Potential)" before "10 (Potential)") and non-
      // numeric ids ("future") fall to the very end.
      const phaseIds = Object.keys(phasesMeta).sort((a, b) => {
        const ia = phasesMeta[a] || {}; const ib = phasesMeta[b] || {};
        const fa = _isFutureDate(ia.date) ? 1 : 0;
        const fb = _isFutureDate(ib.date) ? 1 : 0;
        if (fa !== fb) return fa - fb;
        if (fa === 1) {
          const na = parseInt(a, 10);
          const nb = parseInt(b, 10);
          if (!isNaN(na) && !isNaN(nb)) return na - nb;
          if (!isNaN(na)) return -1;
          if (!isNaN(nb)) return 1;
          return a < b ? -1 : a > b ? 1 : 0;
        }
        return (ia.date || '') < (ib.date || '') ? -1 : (ia.date || '') > (ib.date || '') ? 1 : 0;
      });
      // futurePhases was already populated up at the top of .then so
      // the features loop's styling branch could see it. Re-populate
      // here is a no-op safety net for any phases that only appeared
      // after meta finished loading (none in practice).
      window._phasesMeta = phasesMeta;
      const hour = meta.high_frequency_hour;
      const hourLabel = hour === 0 ? 'midnight' : hour === 12 ? 'noon' : hour < 12 ? `${hour} am` : `${hour - 12} pm`;
      const hfCount = meta.high_frequency_route_count || 0;
      const hfThreshold = meta.high_frequency_threshold;

      const selectedPhases = new Set();
      window._selectedPhases = selectedPhases;
      // Expose the route-to-phase map so the tooltip helper can
      // narrow its route list to the active phase selection.
      window._routePhase = routePhase;

      function applyPhaseSelection() {
        if (selectedPhases.size === 0) {
          clearHighlight();
          return;
        }
        const routes = [];
        for (const [r, p] of Object.entries(routePhase)) {
          if (selectedPhases.has(p)) routes.push(r);
        }
        applyHighlight(routes);
      }

      const panelControl = L.control({ position: 'topright' });
      panelControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'panel');
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);

        const catRows = LEGEND_ORDER.map(cat => {
          const c = meta.category_colours[cat];
          const count = (meta.category_route_counts || {})[cat] || 0;
          const note = cat === 'spine'
            ? `<div class="row-note">Routes with more than ${hfThreshold} trips per hour at ${hourLabel} are high-frequency.</div>`
            : '';
          return `<div class="row" data-cat="${cat}">
            <div class="row-left">
              <span class="swatch" style="background:${c}"></span>
              <span class="label-text">${CATEGORY_LABELS[cat]}</span>
            </div>
            <span class="row-count">${count}</span>
          </div>${note}`;
        }).join('');

        let liveRows = '';
        let futureRows = '';
        const legacyCount = phaseRouteCounts.legacy || 0;
        if (legacyCount) {
          liveRows += `<div class="row" data-phase="legacy">
            <div class="row-left">
              <span class="check"></span>
              <span class="label-text"><span class="phase-id">—</span><span class="phase-date">pre-BusConnects</span></span>
            </div>
            <span class="row-count">${legacyCount}</span>
          </div>`;
        }
        for (const pid of phaseIds) {
          const info = phasesMeta[pid];
          const cnt = phaseRouteCounts[pid] || 0;
          const row = `<div class="row" data-phase="${pid}">
            <div class="row-left">
              <span class="check"></span>
              <span class="label-text"><span class="phase-id">${pid}</span><span class="phase-date">${info.date}</span></span>
            </div>
            <span class="row-count">${cnt}</span>
          </div>`;
          if (futurePhases.has(pid)) futureRows += row;
          else liveRows += row;
        }

        div.innerHTML = `
          <div class="panel-header">
            <h3>Dublin city bus network</h3>
            <div class="panel-sub">${meta.reference_date} · ${meta.route_count} routes</div>
          </div>
          <div class="panel-body">
            <div class="section">
              <div class="section-title">Search routes</div>
              <input type="text" class="search-input" placeholder="route, destination, or agency"
                     autocomplete="off" spellcheck="false" />
              <div class="search-results"></div>
            </div>
            <div class="section">
              <div class="section-title">Route categories</div>
              ${catRows}
            </div>
            ${liveRows ? `<div class="section">
              <div class="section-title">BusConnects phase</div>
              ${liveRows}
            </div>` : ''}
            ${futureRows ? `<div class="section future-section">
              <div class="section-title">Future / potential phases</div>
              <div class="section-note">Routes and rollout dates here are
                proposals and may change. Tap a phase to preview the
                planned network; routes it replaces will hide.</div>
              ${futureRows}
            </div>` : ''}
          </div>
        `;

        // Category rows toggle layer visibility for both the line
        // group and any shield markers belonging to that category.
        div.querySelectorAll('[data-cat]').forEach(row => {
          row.addEventListener('click', () => {
            const cat = row.getAttribute('data-cat');
            if (visibleCategories.has(cat)) {
              visibleCategories.delete(cat);
              map.removeLayer(groupsByCategory[cat]);
              row.classList.add('inactive');
            } else {
              visibleCategories.add(cat);
              groupsByCategory[cat].addTo(map);
              row.classList.remove('inactive');
            }
            applyLabelVisibility();
          });
        });

        // Phase rows have two modes depending on the phase's date:
        //  - future phases (date === "future") act as visibility
        //    toggles. Activating one reveals its routes and hides any
        //    listed in its `replacing` array.
        //  - historical phases retain the highlight-only behavior.
        div.querySelectorAll('[data-phase]').forEach(row => {
          row.addEventListener('click', () => {
            const pid = row.getAttribute('data-phase');
            if (futurePhases.has(pid)) {
              if (visibleFuturePhases.has(pid)) visibleFuturePhases.delete(pid);
              else visibleFuturePhases.add(pid);
              applyVisibility();
              return;
            }
            if (selectedPhases.has(pid)) {
              selectedPhases.delete(pid);
              row.classList.remove('active');
            } else {
              selectedPhases.add(pid);
              row.classList.add('active');
            }
            applyPhaseSelection();
          });
        });

        // Build a compact route index for the search box. One entry per
        // route_id with its long_name + agency + category colour, harvested
        // from whichever feature first carries each id.
        const routeIndex = new Map();
        for (const item of allLayers) {
          const p = item.feature.properties;
          const ids = p.routes || (p.route ? [p.route] : []);
          for (const rid of ids) {
            if (routeIndex.has(rid)) continue;
            routeIndex.set(rid, {
              id: rid,
              long: p.route_long_name || '',
              agency: p.agency || '',
              colour: p.colour || '#888',
              phase: p.phase || '',
            });
          }
        }
        const routeIndexList = Array.from(routeIndex.values())
          .sort((a, b) => compareRouteShort(a.id, b.id));

        // Mobile bottom-sheet toggle: tapping the header expands /
        // collapses the panel. The .expanded class is only styled
        // under the mobile media query, so this handler is a no-op
        // on desktop (class toggles but nothing references it).
        const panelHeader = div.querySelector('.panel-header');
        panelHeader.addEventListener('click', () => {
          div.classList.toggle('expanded');
        });

        const searchInput = div.querySelector('.search-input');
        const searchResults = div.querySelector('.search-results');

        // Focusing the search input on mobile should expand the
        // sheet so the user can see what they're typing into - the
        // input is inside .panel-body which is hidden when collapsed.
        searchInput.addEventListener('focus', () => {
          div.classList.add('expanded');
        });

        function renderSearchResults(query) {
          const q = (query || '').trim().toLowerCase();
          if (!q) {
            searchResults.innerHTML = '';
            return;
          }
          const matches = routeIndexList.filter(r =>
            r.id.toLowerCase().includes(q)
            || r.long.toLowerCase().includes(q)
            || r.agency.toLowerCase().includes(q)
          ).slice(0, 25);
          if (!matches.length) {
            searchResults.innerHTML = '<div class="search-empty">No routes match.</div>';
            return;
          }
          searchResults.innerHTML = matches.map(r => `
            <div class="search-row" data-route="${r.id}">
              <span class="swatch" style="background:${r.colour}"></span>
              <span class="search-route">${r.id}</span>
              <span class="search-long">${r.long || r.agency || ''}</span>
            </div>
          `).join('');
        }

        // Event delegation: one listener on the container handles
        // every current and future result row, so renderSearchResults
        // doesn't have to re-attach handlers per keystroke.
        searchResults.addEventListener('click', e => {
          const row = e.target.closest('[data-route]');
          if (!row) return;
          applyHighlight([row.getAttribute('data-route')]);
        });

        searchInput.addEventListener('input', e => renderSearchResults(e.target.value));
        searchInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            const first = searchResults.querySelector('[data-route]');
            if (first) first.click();
          } else if (e.key === 'Escape') {
            searchInput.value = '';
            searchResults.innerHTML = '';
            searchInput.blur();
          }
        });

        return div;
      };
      panelControl.addTo(map);

      // Initial state: future phases are off, replaced routes are
      // visible. applyVisibility hides any phase=future features and
      // recomputes label display.
      applyVisibility();

      // One-time runtime sanity check. If this prints any non-zero
      // count of visible future labels right after init, the wiring
      // is broken and the rest of the visibility logic won't save us.
      try {
        const stat = { futureTotal: 0, futureVisible: 0, futurePhasesSeen: new Set() };
        for (const lbl of allLabels) {
          if (!futurePhases.has(lbl.phase)) continue;
          stat.futureTotal++;
          stat.futurePhasesSeen.add(lbl.phase);
          const el = lbl.marker && lbl.marker.getElement && lbl.marker.getElement();
          if (el && el.style.display !== 'none') stat.futureVisible++;
        }
        console.log('[map] future labels on first load:',
          { total: stat.futureTotal, visible: stat.futureVisible,
            phases: [...stat.futurePhasesSeen] });
        if (stat.futureVisible > 0) {
          console.warn('[map] expected 0 visible future labels at load; check applyLabelVisibility wiring');
        }
      } catch (e) {
        console.warn('[map] sanity check failed', e);
      }

      map.on('click', () => {
        if (selectedRoutes) clearHighlight();
        // Collapse the mobile sheet when the user taps the map.
        // Harmless on desktop (no media-query rule consumes the class).
        const panel = document.querySelector('.panel');
        if (panel) panel.classList.remove('expanded');
      });
    }).catch(err => {
      console.error('Map init failed:', err);
      // Surface the actual error message so we don't blame the data
      // fetch for runtime errors that happen after it succeeds.
      const detail = err && err.message ? ` (${err.message})` : '';
      showError(
        'Map failed to initialise' + detail
        + '. Open the browser console for the full stack trace.'
      );
    });
  </script>
</body>
</html>
