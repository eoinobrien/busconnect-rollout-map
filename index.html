<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dublin city bus network</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .legend {
      background: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 1.55;
    }
    .legend h4 { margin: 0 0 6px 0; font-size: 13px; }
    .legend .swatch {
      display: inline-block;
      width: 14px; height: 4px;
      vertical-align: middle;
      margin-right: 6px;
    }
    .legend .meta {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #ddd;
      font-size: 11px;
      color: #555;
    }

    .leaflet-tooltip.route-tooltip {
      font-size: 12px;
      padding: 4px 8px;
      max-width: 280px;
    }

    .route-badge {
      background: white;
      border: 2px solid var(--c, #888);
      color: var(--c, #444);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 1px 1px rgba(0,0,0,0.15);
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
      line-height: 1.25;
      text-align: center;
      white-space: normal;
      width: 100%;
      box-sizing: border-box;
    }
    /* Leaflet's marker-icon parent sizes via iconSize. Override its
       default white-background-with-border styling so the badge child
       can paint cleanly instead of double-bordering. */
    .route-badge-wrapper,
    .leaflet-div-icon.route-badge-wrapper {
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
      width: auto !important;
      height: auto !important;
    }

    /* Applied to badges that don't belong to the currently-selected
       route(s); washes them out to grey so the selection stands out. */
    .route-badge.dimmed {
      --c: #b8b8b8;
      background: #f4f4f4;
      box-shadow: none;
      opacity: 0.55;
    }

    .clear-highlight {
      position: absolute;
      top: 12px; right: 50%;
      transform: translateX(50%);
      z-index: 1000;
      background: #333;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      display: none;
    }

    .error-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #c0392b;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="clearHighlight" class="clear-highlight">Clear selection (Esc)</div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const CATEGORY_LABELS = {
      spine: 'Spines & high-frequency',
      orbital: 'Orbital (W / N / S)',
      local: 'Local (L)',
      peak: 'Peak only / express (P, X)',
      radial: 'Radial routes',
    };
    // Render order: lower categories drawn first, so spines paint over
    // everything. Layer-control order matches.
    const CATEGORY_ORDER = ['radial', 'peak', 'local', 'orbital', 'spine'];
    const LEGEND_ORDER = ['spine', 'orbital', 'local', 'peak', 'radial'];

    // Per-category screen-pixel offset for label badges, so a junction
    // served by 5 categories doesn't stack 5 badges in one spot. Lays
    // them out around the junction in a fixed pattern.
    const CATEGORY_BADGE_OFFSET = {
      spine:   [0,    0],
      orbital: [0,   -24],
      local:   [-28, 16],
      peak:    [28,  16],
      radial:  [0,   28],
    };

    const map = L.map('map', { preferCanvas: true }).setView([53.345, -6.26], 11);
    const lineRenderer = L.canvas({ padding: 0.4 });

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> &middot; Data: <a href="https://www.transportforireland.ie/">Transport for Ireland</a> GTFS',
        subdomains: 'abcd',
        maxZoom: 19,
      }
    ).addTo(map);

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error-banner';
      div.textContent = msg;
      document.body.appendChild(div);
    }

    const allLines = [];   // {layer, feature, baseStyle}
    const allLabels = [];  // {marker, routes, category}
    let selectedRoutes = null;  // Set<string> or null

    function lineWeight(feature) {
      const c = feature.properties.route_count || 1;
      // Shared segments are emphasised; cap so very-popular corridors
      // don't draw a 20 px line.
      return Math.min(2 + Math.sqrt(c), 6);
    }

    function lineStyle(feature) {
      const p = feature.properties;
      const isShared = p.kind === 'shared';
      return {
        color: p.colour,
        weight: lineWeight(feature),
        opacity: isShared ? 0.92 : 0.7,
        lineCap: 'round',
        lineJoin: 'round',
      };
    }

    function dimStyle() {
      return { color: '#cfcfcf', weight: 1.2, opacity: 0.4 };
    }

    function highlightStyle(baseStyle) {
      return {
        ...baseStyle,
        weight: (baseStyle.weight || 3) + 2,
        opacity: 1,
      };
    }

    function routesOnFeature(f) {
      if (f.properties.route_set) return f.properties.route_set;
      if (f.properties.routes) return f.properties.routes;
      if (f.properties.route_short_name) return [f.properties.route_short_name];
      return [];
    }

    function applyHighlight(routeNames) {
      const set = new Set(routeNames);
      selectedRoutes = set;
      for (const item of allLines) {
        const matches = routesOnFeature(item.feature).some(r => set.has(r));
        if (matches) {
          item.layer.setStyle(highlightStyle(item.baseStyle));
          if (item.layer.bringToFront) item.layer.bringToFront();
        } else {
          item.layer.setStyle(dimStyle());
        }
      }
      for (const item of allLabels) {
        const el = item.marker.getElement();
        if (!el) continue;
        const badge = el.querySelector('.route-badge');
        if (!badge) continue;
        const matches = item.routes.some(r => set.has(r));
        badge.classList.toggle('dimmed', !matches);
      }
      document.getElementById('clearHighlight').style.display = 'block';
    }

    function clearHighlight() {
      selectedRoutes = null;
      for (const item of allLines) {
        item.layer.setStyle(item.baseStyle);
      }
      for (const item of allLabels) {
        const el = item.marker.getElement();
        if (!el) continue;
        const badge = el.querySelector('.route-badge');
        if (badge) badge.classList.remove('dimmed');
      }
      document.getElementById('clearHighlight').style.display = 'none';
    }

    document.getElementById('clearHighlight').addEventListener('click', clearHighlight);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearHighlight(); });

    function tooltipForLine(f) {
      const p = f.properties;
      const routes = routesOnFeature(f);
      const kindLabel = p.kind === 'shared' ? 'Shared section' : 'Single route';
      return `<b>${kindLabel}</b><br>${routes.join(', ')}<br><i>${CATEGORY_LABELS[p.category] || p.category}</i>`;
    }

    function tooltipForLabel(f) {
      const p = f.properties;
      return `<b>${p.routes.join(', ')}</b><br><i>${CATEGORY_LABELS[p.category] || p.category} terminus</i>`;
    }

    Promise.all([
      fetch('output/segments.geojson').then(r => r.json()),
      fetch('output/labels.geojson').then(r => r.json()),
      fetch('output/meta.json').then(r => r.json()),
    ]).then(([segments, labels, meta]) => {
      const groupsByCategory = {};
      for (const cat of CATEGORY_ORDER) groupsByCategory[cat] = L.layerGroup();

      function addLine(feature) {
        const cat = feature.properties.category || 'radial';
        const baseStyle = lineStyle(feature);
        const layer = L.geoJSON(feature, {
          style: () => baseStyle,
          renderer: lineRenderer,
        });
        layer.eachLayer(l => {
          l.bindTooltip(tooltipForLine(l.feature), {
            className: 'route-tooltip',
            sticky: true,
          });
          l.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            applyHighlight(routesOnFeature(l.feature));
          });
        });
        layer.addTo(groupsByCategory[cat]);
        allLines.push({ layer, feature, baseStyle });
      }

      for (const f of segments.features) addLine(f);

      // One label sub-layer per category so toggling a category in
      // the layer control hides both its lines and its badges in one
      // shot, and zoom-based show/hide can act per-category.
      const labelLayersByCategory = {};
      for (const cat of CATEGORY_ORDER) labelLayersByCategory[cat] = L.layerGroup();

      for (const f of labels.features) {
        const p = f.properties;
        const [lon, lat] = f.geometry.coordinates;
        // Estimate badge size from text so the leaflet container is
        // wide enough to let multi-route labels wrap onto multiple
        // lines without breaking every character. Account for an even
        // border + padding budget so single- and multi-route badges
        // get a consistent visual frame.
        const charWidth = 6.5;
        const horizontalPadding = 16;  // 2x6 padding + 2x2 border
        const verticalPadding = 8;     // 2x2 padding + 2x2 border
        const lineHeight = 13;
        const naturalWidth = p.label.length * charWidth + horizontalPadding;
        const width = Math.min(180, Math.max(24, naturalWidth));
        const lines = Math.max(1, Math.ceil(
          (p.label.length * charWidth) / (width - horizontalPadding)
        ));
        const height = lines * lineHeight + verticalPadding;
        const html = `<div class="route-badge" style="--c:${p.colour}" title="${p.routes.join(', ')}">${p.label}</div>`;
        const [dx, dy] = CATEGORY_BADGE_OFFSET[p.category] || [0, 0];
        const marker = L.marker([lat, lon], {
          icon: L.divIcon({
            html,
            className: 'route-badge-wrapper',
            iconSize: [width, height],
            // iconAnchor is the pixel inside the icon that maps to the
            // lat/lon. Shifting it shifts the rendered icon in the
            // opposite direction, giving us a per-category nudge.
            iconAnchor: [width / 2 - dx, height / 2 - dy],
          }),
          interactive: true,
        });
        marker.bindTooltip(tooltipForLabel(f), {
          className: 'route-tooltip',
          direction: 'top',
        });
        marker.on('click', (ev) => {
          L.DomEvent.stopPropagation(ev);
          applyHighlight(p.routes);
        });
        const cat = p.category || 'radial';
        marker.addTo(labelLayersByCategory[cat]);
        allLabels.push({ marker, routes: p.routes, category: cat });
      }

      // Track which categories the user has currently enabled (lines).
      const enabledCategories = new Set(CATEGORY_ORDER);

      function syncLabels() {
        const zoomOk = map.getZoom() >= 12;
        for (const cat of CATEGORY_ORDER) {
          const ll = labelLayersByCategory[cat];
          const shouldShow = zoomOk && enabledCategories.has(cat);
          if (shouldShow && !map.hasLayer(ll)) ll.addTo(map);
          else if (!shouldShow && map.hasLayer(ll)) map.removeLayer(ll);
        }
      }
      map.on('zoomend', syncLabels);
      map.on('overlayadd', (e) => { if (e.name && e._cat) { /* set below */ } });

      // Add categories in render order: radial first (back), spine last (front).
      for (const cat of CATEGORY_ORDER) groupsByCategory[cat].addTo(map);
      syncLabels();

      // Layer control in legend order: spine top, radial bottom.
      const overlays = {};
      const overlayLabelToCategory = {};
      for (const cat of LEGEND_ORDER) {
        const colour = meta.category_colours[cat];
        const swatch = `<span style="display:inline-block;width:12px;height:3px;background:${colour};margin-right:6px;vertical-align:middle"></span>`;
        const count = (meta.category_route_counts || {})[cat] || 0;
        const labelHtml = `${swatch}${CATEGORY_LABELS[cat]} (${count})`;
        overlays[labelHtml] = groupsByCategory[cat];
        overlayLabelToCategory[labelHtml] = cat;
      }
      L.control.layers(null, overlays, { collapsed: false, position: 'topright' }).addTo(map);

      // Reflect line-category toggles into label visibility.
      map.on('overlayadd', (e) => {
        const cat = overlayLabelToCategory[e.name];
        if (cat) { enabledCategories.add(cat); syncLabels(); }
      });
      map.on('overlayremove', (e) => {
        const cat = overlayLabelToCategory[e.name];
        if (cat) { enabledCategories.delete(cat); syncLabels(); }
      });

      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        let html = '<h4>Route categories</h4>';
        for (const cat of LEGEND_ORDER) {
          const c = meta.category_colours[cat];
          const count = (meta.category_route_counts || {})[cat] || 0;
          html += `<div><span class="swatch" style="background:${c}"></span>${CATEGORY_LABELS[cat]} <span style="color:#888">(${count})</span></div>`;
        }
        const hf = meta.high_frequency_route_count || 0;
        const labelCount = labels.features.length;
        html += `<div class="meta">Network of ${meta.reference_date}<br>${meta.route_count} routes &middot; ${meta.segment_feature_count} segments &middot; ${labelCount} labels<br>${hf} routes promoted to red by 8 am frequency<br><i>Click a route to highlight</i></div>`;
        div.innerHTML = html;
        return div;
      };
      legend.addTo(map);

      map.on('click', () => { if (selectedRoutes) clearHighlight(); });
    }).catch(err => {
      console.error(err);
      showError(
        'Could not load output GeoJSON. Run "python build.py" then serve via "python -m http.server --bind 127.0.0.1" and reload.'
      );
    });
  </script>
</body>
</html>
